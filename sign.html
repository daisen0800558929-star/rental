<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4fa0">
<link rel="icon" href="logo.png">
<title>報價單線上簽名｜大森節能</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="sheet.css">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--line:#dde2ea;--fg:#1b2230;--muted:#5d6779;--accent:#1f4fa0;--ok:#1d7a4c;--bad:#b4282c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{height:40px;width:auto;background:#fff;border-radius:4px}
header b{font-size:16px}
header .s{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h1{font-size:18px;margin:0 0 4px}
.note{font-size:13.5px;color:var(--muted)}
#sheetBox{overflow:hidden;background:#fff}
#sheetBox .sheet{--ink:#000;--rule:#444;--fg:#000;background:#fff;color:#000;width:760px;transform-origin:0 0}
.sigpad{width:100%;height:200px;background:#fff;border:1.5px dashed var(--muted);border-radius:8px;touch-action:none;display:block}
label{display:grid;gap:4px;font-size:14px;margin-top:12px}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.agree input{width:20px;height:20px;margin-top:2px;flex:none}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:16px;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;flex:1}
button:disabled{opacity:.55}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.done{text-align:center;padding:24px 14px}
.done .big{font-size:20px;font-weight:700;color:var(--ok);margin-bottom:6px}
.done img{max-width:260px;width:100%;border:1px solid var(--line);margin-top:12px;background:#fff}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.png" alt="大森節能"><div><b>大森節能事業有限公司</b><div class="s">全國服務專線 <a href="tel:0800558929">0800-558-929</a></div></div></header>
  <div id="app"><div class="card note">載入中…</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getFirestore,doc,getDoc,updateDoc} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const fs=getFirestore(initializeApp({apiKey:"AIzaSyA-lXRTR38AeFMgSwYCD91Akywgxgb5ZB4",authDomain:"daisen-rental.firebaseapp.com",projectId:"daisen-rental",storageBucket:"daisen-rental.firebasestorage.app",messagingSenderId:"687274188760",appId:"1:687274188760:web:41035f0278d21ebd99dcad"}));
const $=s=>document.querySelector(s),app=$("#app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(t,s)=>app.innerHTML=`<div class="card done"><div class="big" style="${s?"":"color:var(--fg)"}">${t}</div><div class="note">如有任何問題，請來電 <a href="tel:0800558929">0800-558-929</a>。</div></div>`;
const token=new URLSearchParams(location.search).get("t")||"";
const ref=token?doc(fs,"signReqs",token):null;

async function main(){
  if(!/^[a-z0-9]{20,40}$/.test(token))return msg("連結不完整，請確認是否複製完整網址。");
  let r;
  try{const s=await getDoc(ref);if(!s.exists())return msg("這個簽名連結已失效。請聯絡業務人員重新傳送。");r=s.data()}
  catch(e){return msg(e.code==="permission-denied"?"這個簽名連結已失效。請聯絡業務人員重新傳送。":"網路連線失敗，請稍後再重新整理。")}
  if(r.status!=="open")return msg("這份報價單已完成簽名，謝謝您！",true);
  if(r.expiresAt?.toDate&&r.expiresAt.toDate()<new Date())return msg("這個簽名連結已過期。請聯絡業務人員重新傳送。");
  document.title="報價單 "+(r.no||"")+" 線上簽名｜大森節能";
  app.innerHTML=`<div class="card"><h1>${esc(r.cust||"")} 您好</h1><div class="note">請確認以下報價單及合約內容，沒有問題請在最下方簽名送出。可用兩指放大檢視。</div></div>
  <div class="card" style="padding:10px"><div id="sheetBox">${r.sheetHtml||""}</div></div>
  <form class="card" id="f">
    <b>客戶簽名</b>
    <div class="note" style="margin:4px 0 8px">請在白色框內用手指簽名</div>
    <canvas class="sigpad" id="pad"></canvas>
    <label>簽署人姓名<input type="text" id="who" value="${esc(r.contact||"")}" maxlength="40" required autocomplete="name"></label>
    <label class="agree"><input type="checkbox" id="ok" required><span>我已閱讀並同意上述報價及合約內容</span></label>
    <div class="err" id="err" hidden></div>
    <div class="row"><button type="button" id="clr">清除重簽</button><button class="primary" type="submit" id="go">確認簽名送出</button></div>
  </form>`;
  /* 讓 A4 版面縮放到手機寬度 */
  const box=$("#sheetBox"),sh=box.querySelector(".sheet");
  const fit=()=>{if(!sh)return;const k=Math.min(1,box.clientWidth/760);sh.style.transform=`scale(${k})`;box.style.height=sh.offsetHeight*k+"px"};
  fit();addEventListener("resize",fit);box.querySelectorAll("img").forEach(i=>i.addEventListener("load",fit));
  /* 簽名板 */
  const cv=$("#pad"),ctx=cv.getContext("2d");let drawn=false,down=false;
  const size=()=>{const b=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=b.width*d;cv.height=b.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,b.width,b.height);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";drawn=false};
  size();
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);ctx.beginPath();ctx.moveTo(a,b)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[a,b]=pt(e);ctx.lineTo(a,b);ctx.stroke();drawn=true});
  cv.addEventListener("pointerup",()=>down=false);cv.addEventListener("pointercancel",()=>down=false);
  $("#clr").onclick=size;
  const err=t=>{const e=$("#err");e.textContent=t;e.hidden=!t};
  $("#f").onsubmit=async e=>{
    e.preventDefault();err("");
    if(!drawn)return err("請先在框內簽名。");
    const who=$("#who").value.trim();if(!who)return err("請填寫簽署人姓名。");
    /* 縮小到寬 700px 以內，控制檔案大小 */
    const k=Math.min(1,700/cv.width),o=document.createElement("canvas");o.width=Math.round(cv.width*k);o.height=Math.round(cv.height*k);
    o.getContext("2d").drawImage(cv,0,0,o.width,o.height);const img=o.toDataURL("image/png");
    const b=$("#go");b.disabled=true;b.textContent="送出中…";
    try{
      await updateDoc(ref,{status:"signed",signature:img,signerName:who,signedAt:new Date().toISOString()});
      app.innerHTML=`<div class="card done"><div class="big">簽名完成，謝謝您！</div><div class="note">我們已收到您的簽名（報價單 ${esc(r.no||"")}），業務人員將盡快與您聯絡安排出貨及安裝。</div><img src="${img}" alt="您的簽名"></div>`;
      scrollTo(0,0);
    }catch(e2){b.disabled=false;b.textContent="確認簽名送出";err(e2.code==="permission-denied"?"連結已失效或已完成簽名，請重新整理頁面。":"送出失敗，請檢查網路後再試一次。")}
  };
}
main();
</script>
</body>
</html>
