<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa0">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>大森租賃管理系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + tab bar, one-column work list; stat strip on overview; dialog forms */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#dde2ea; --fg:#1b2230; --muted:#5d6779;
  --accent:#1f4fa0; --accent-soft:#e6edf8; --on-accent:#ffffff;
  --ok:#1d7a4c; --ok-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b4282c; --bad-soft:#fae4e4;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:18px 48px;display:grid;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{flex:1 1 180px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:500;padding:9px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
section h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--bg);color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.dlg{display:grid;gap:14px;padding:18px}
.dlg h3{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .spacer{flex:1}
.calc{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
dialog.wide{width:min(980px,calc(100vw - 32px))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.items{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.items th{background:var(--bg);color:var(--muted);font-weight:500;font-size:12.5px;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items td input{padding:7px 8px}
table.items .num{text-align:right}
table.items td.idx{color:var(--muted);text-align:center;width:36px}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 18px;font-size:14px}
.totals .grand{font-size:17px;font-weight:700}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0;min-width:0}
legend{font-size:13px;color:var(--muted);padding:0 6px}
/* 報價單（預覽與列印） */
.sheet{--ink:var(--fg);--rule:var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.5;display:grid;gap:14px}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;flex-wrap:wrap}
.sheet .sh-co{font-size:19px;font-weight:700;letter-spacing:.04em}
.sheet .sh-title{font-size:22px;font-weight:700;letter-spacing:.5em}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid var(--rule);padding:5px 7px;vertical-align:top;text-align:left}
.sheet th{font-weight:500;white-space:nowrap;width:1%}
.sheet .grid-info td{width:auto}
.sheet .it th{text-align:center;width:auto}
.sheet .it td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .it td.c{text-align:center}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sheet .signbox{border:1px solid var(--rule);min-height:120px;padding:8px 10px;display:grid;grid-template-rows:auto 1fr auto}
.sheet .signbox img{max-height:90px;max-width:100%;background:#fff}
.sheet .small{font-size:12px;color:var(--muted)}
.sheet-wrap{border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto}
.sheet-wrap .sheet{min-width:640px}
.sigpad{width:100%;height:220px;background:#fff;border:1px dashed var(--muted);border-radius:6px;touch-action:none;display:block}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .sheet{--ink:#000;--rule:#555;background:#fff;color:#000}
  #printArea .sheet .small{color:#333}
  #printArea .sheet-wrap{border:0;padding:0}
}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%);display:grid;gap:14px;box-sizing:border-box}
.login h1{font-size:21px}
.userbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.userbox .sub{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 功能選單 */
.menu-top{background:var(--surface);border-bottom:1px solid var(--line)}
.menu-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.menu-top img{height:40px;width:auto;background:#fff;border-radius:4px;display:block}
.menu-main{padding-block:22px 48px;display:grid;gap:16px}
.menu-main h2{margin:0;font-size:18px}
.wheel-wrap{container-type:inline-size;width:min(640px,100%);margin:0 auto}
.wheel{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;cursor:pointer;
  background:var(--c);color:#fff;font:inherit;font-weight:700;font-size:clamp(10px,3.1cqw,19px);line-height:1.25;
  display:grid;place-items:center;text-align:center;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.18);box-sizing:border-box}
.node span{display:block;overflow-wrap:anywhere}
.node.soon{background:color-mix(in srgb,var(--c) 62%,var(--bg));color:rgba(255,255,255,.95)}
.node:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.node{transition:transform .15s ease,opacity .15s}.node:hover{transform:translate(-50%,-50%) scale(1.08)}}
.node .badge{position:absolute;top:2%;right:2%;min-width:1.6em;height:1.6em;border-radius:999px;background:#fff;color:#b4282c;font-size:.8em;display:grid;place-items:center;padding:0 .3em;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hub{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#4a7ebb;color:#fff;
  display:grid;place-content:center;text-align:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.hub b{font-size:clamp(20px,8cqw,52px);letter-spacing:.02em;line-height:1}
.hub small{font-size:clamp(10px,2.6cqw,16px);opacity:.9}
.wheel-note{text-align:center;font-size:12.5px;color:var(--muted)}
#splash{position:fixed;inset:0;z-index:50;background:#ffffff;display:grid;place-items:center;cursor:pointer;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#splash button{border:0;background:none;padding:0;cursor:pointer;border-radius:12px}
#splash button:focus-visible{outline:3px solid #1f4fa0;outline-offset:8px}
#splash img{width:min(520px,82vw);height:auto;display:block}
#splash.leave{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #splash{transition:opacity .35s ease}
  #splash img{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
}
</style>
</head>
<body>
<div id="splash"><button type="button" id="enterBtn" aria-label="進入大森租賃管理系統"><img src="logo.png" alt="大森節能"></button></div>
<div class="login" id="loginView">
  <form id="loginForm" novalidate>
    <img src="logo.png" alt="大森節能" style="height:64px;width:auto;justify-self:start;background:#fff;border-radius:6px"><div><h1>大森租賃管理</h1><div class="sub">請使用公司開通的帳號登入</div></div>
    <div class="banner" id="loginErr" hidden></div>
    <label>Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label>密碼<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="loginBtn">登入</button>
    <button class="btn" type="button" id="resetBtn">忘記密碼</button>
  </form>
</div>
<div id="menuView" hidden>
  <div class="menu-top"><div class="wrap">
    <img src="logo.png" alt="大森節能">
    <div class="userbox"><span class="sub" id="whoami2"></span><button class="btn small" id="logoutBtn2" type="button">登出</button></div>
  </div></div>
  <div class="wrap"><main class="menu-main"><div class="wheel-wrap"><div class="wheel" id="tiles"></div></div><div class="wheel-note">點選圓圈進入功能　淡色為建置中</div></main></div>
</div>
<div id="appView" hidden>
<header>
  <div class="wrap">
    <div class="head">
      <div><h1>租賃管理</h1><div class="sub" id="sync">連線中…</div></div>
      <div class="userbox"><button class="btn small" id="menuBtn" type="button">☰ 功能選單</button><span class="sub" id="whoami"></span><button class="btn small" id="remindBtn" type="button" hidden>到期提醒 <b class="mono" id="remindCount">0</b></button><button class="btn small" id="logoutBtn" type="button">登出</button><button class="btn primary" id="newBtn" type="button">＋ 新增租約</button></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">總覽</button>
      <button role="tab" data-tab="contracts" aria-selected="false">租約</button>
      <button role="tab" data-tab="equipment" aria-selected="false">設備</button>
      <button role="tab" data-tab="customers" aria-selected="false">客戶</button>
      <button role="tab" data-tab="quotes" aria-selected="false">報價</button>
      <button role="tab" data-tab="accounts" aria-selected="false" id="accTab" hidden>帳號</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<dialog id="dlg"><form class="dlg" id="dlgForm" novalidate></form></dialog>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,getDoc} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyA-lXRTR38AeFMgSwYCD91Akywgxgb5ZB4",authDomain:"daisen-rental.firebaseapp.com",projectId:"daisen-rental",storageBucket:"daisen-rental.firebasestorage.app",messagingSenderId:"687274188760",appId:"1:687274188760:web:41035f0278d21ebd99dcad"};
const fbApp=initializeApp(firebaseConfig),fs=getFirestore(fbApp),auth=getAuth(fbApp);
/* 系統擁有者：永遠是管理員，用來開通第一批帳號 */
const OWNER="daisen0800558929@gmail.com";
const ROLES={admin:"管理員",staff:"員工",viewer:"檢視"};
let me=null;
const S={equipment:[],customers:[],contracts:[],quotes:[],staff:[],loaded:{equipment:false,customers:false,contracts:false,quotes:false}};
/* 公司資料：印在報價單抬頭 */
const COMPANY={name:"大森節能事業有限公司",hotline:"0800-558-929",web:"www.daisencool.com.tw",email:"daisen0800558929@gmail.com",hq:"彰化市自強南路537號",north:"桃園市蘆竹區海湖東路372巷58號"};
let db=null, canWrite=true, tab="overview", q="", filter="all";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"NT$ "+Math.round(n||0).toLocaleString("zh-TW");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayNum=s=>{const [y,m,d]=String(s).split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* 計費：日租 = 天數 × 單價；月租 = 以 30 天為一期，不足一期以一期計 */
function rentDays(c){const end=c.status==="已歸還"&&c.returnDate?c.returnDate:c.end;return Math.max(1,daysBetween(c.start,end)+1)}
function rentAmount(c){const d=rentDays(c);return c.unit==="月"?Math.ceil(d/30)*(+c.rate||0):d*(+c.rate||0)}
/* 到期提醒天數：每筆租約可自訂，預設 7 天 */
const remindOf=c=>{const n=parseInt(c.remindDays,10);return Number.isFinite(n)&&n>=0?n:7};
function cState(c){
  if(c.status==="已歸還")return{label:"已歸還",cls:"mute",k:"done"};
  if(c.status==="已取消")return{label:"已取消",cls:"mute",k:"done"};
  const t=todayStr();
  if(c.start>t)return{label:"未開始",cls:"",k:"future"};
  const left=daysBetween(t,c.end);
  if(left<0)return{label:"逾期 "+(-left)+" 天",cls:"bad",k:"overdue"};
  if(left<=remindOf(c))return{label:left===0?"今日到期":left+" 天後到期",cls:"warn",k:"soon"};
  return{label:"租賃中",cls:"ok",k:"active"};
}
const cust=id=>S.customers.find(x=>x.id===id);
const equip=id=>S.equipment.find(x=>x.id===id);
function activeContractOf(eid){return S.contracts.find(c=>c.equipmentId===eid&&c.status==="租賃中")}
function eState(e){
  if(e.repair)return{label:"維修中",cls:"warn"};
  const c=activeContractOf(e.id);
  if(c)return{label:"出租中",cls:"",c};
  return{label:"可出租",cls:"ok"};
}

/* ---------- render ---------- */
function render(){
  renderMenu();
  updateRemind();
  $("#accTab").hidden=me?.role!=="admin";if(tab==="accounts"&&me?.role!=="admin")tab="overview";
  $("#newBtn").hidden=!canWrite;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const m=$("#main");
  if(!db){m.innerHTML=`<div class="banner" id="nodb">${esc(dbMsg)}</div>`;return}
  const loading=!Object.values(S.loaded).every(Boolean);
  let h="";
  if(tab==="overview")h=viewOverview(loading);
  if(tab==="contracts")h=viewContracts(loading);
  if(tab==="equipment")h=viewEquipment(loading);
  if(tab==="customers")h=viewCustomers(loading);
  if(tab==="quotes")h=viewQuotes(loading);
  if(tab==="accounts")h=me?.role==="admin"?viewAccounts():"";
  m.innerHTML=h;
  const si=$("#q");if(si){si.value=q;si.oninput=e=>{q=e.target.value;renderKeepFocus()}}
  const sf=$("#f");if(sf){sf.value=filter;sf.onchange=e=>{filter=e.target.value;render()}}
}

const dlg=$("#dlg"),form=$("#dlgForm");

form.addEventListener("submit",async e=>{e.preventDefault();if(!onSubmit)return;const btn=form.querySelector("[type=submit]");if(btn)btn.disabled=true;
  try{const ok=await onSubmit(new FormData(form));if(ok!==false)dlg.close()}catch(err){showErr(err)}finally{if(btn)btn.disabled=false}});
form.addEventListener("click",e=>{if(e.target.closest("[data-close]"))dlg.close()});
function showErr(err){let el=form.querySelector(".formerr");if(!el){el=document.createElement("div");el.className="banner formerr";form.prepend(el)}
  el.textContent=(err?.code==="permission-denied"||err?.code==="invalid_argument")?"你目前沒有修改權限，無法儲存。":err?.code==="quota_exceeded"?"資料已達上限，請先刪除部分舊資料。":(err?.message||"儲存失敗，請再試一次。")}
const opt=(v,t,sel)=>`<option value="${esc(v)}"${sel?" selected":""}>${esc(t)}</option>`;

function confirmDelete(btnSel,label,fn){const b=form.querySelector(btnSel);if(!b)return;b.onclick=async()=>{

const QSTATUS={draft:["草稿","mute"],sent:["已報價",""],signed:["已簽回","ok"],lost:["未成交","bad"]};
const TAX={none:"未稅",excl:"外加 5% 營業稅",incl:"含稅"};
function quoteCalc(q){
  const items=(q.items||[]).map(i=>({...i,sub:Math.round((+i.qty||0)*(+i.price||0))}));
  const sum=items.reduce((s,i)=>s+i.sub,0);
  const tax=q.taxMode==="excl"?Math.round(sum*0.05):0;
  return{items,sum,tax,total:sum+tax};
}
function viewQuotes(loading){
  const qq=q.trim().toLowerCase();
  const rows=S.quotes.filter(x=>!qq||[x.no,x.cust?.name,x.cust?.contact,x.sales].join(" ").toLowerCase().includes(qq))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.no).localeCompare(String(a.no))).map(x=>{
    const st=QSTATUS[x.status]||QSTATUS.draft;
    return `<div class="row" data-open="quote" data-id="${esc(x.id)}" tabindex="0">
      <div><div class="t">${esc(x.cust?.name||"（未填客戶）")}</div><div class="m"><span class="mono">${esc(x.no)}</span> · ${esc(x.date)}${x.sales?" · 業務 "+esc(x.sales):""} · ${(x.items||[]).length} 項</div></div>
      <div class="r"><span class="pill ${st[1]}">${st[0]}</span><span class="mono m">${money(quoteCalc(x).total)}</span></div></div>`});
  return `<div class="toolbar"><input id="q" placeholder="搜尋單號、客戶、業務">${canWrite?'<button class="btn primary" type="button" data-new="quote">＋ 新增報價</button>':""}</div>
  <div class="list">${emptyOr(rows,loading,"還沒有報價單。按「新增報價」建立第一張。")}</div>`;

function signQuote(x){
  openDlg(`<h3>客戶簽名　<span class="mono note">${esc(x.no)}</span></h3>
  <div class="note">請客戶在下方框內用手指或滑鼠簽名。</div>

  async fd=>{
    if(!drawn){showErr({message:"請先在框內簽名。"});return false}
    const img=cv.toDataURL("image/png");
    await db.doc("quotes/"+x.id).update({signature:img,signerName:val(fd,"signerName"),signedAt:new Date().toISOString(),status:"signed"});toast("已完成簽名");
  });
  const cv=$("#sigpad"),ctx=cv.getContext("2d");let drawn=false,down=false;
  const size=()=>{const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";drawn=false};
  size();
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);ctx.beginPath();ctx.moveTo(a,b)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[a,b]=pt(e);ctx.lineTo(a,b);ctx.stroke();drawn=true});
  cv.addEventListener("pointerup",()=>down=false);cv.addEventListener("pointercancel",()=>down=false);
  $("#clearSig").onclick=size;
}

  const self=!isNew&&u.id===me.email, owner=!isNew&&u.id===OWNER, locked=self||owner;
  openDlg(`<h3>${isNew?"新增帳號":esc(u.name||u.id)}</h3>
  <div class="grid2">
    <label>姓名<input name="name" value="${esc(u.name||"")}" required></label>
    <label>手機（印在報價單）<input name="mobile" value="${esc(u.mobile||"")}" inputmode="tel"></label>
    <label class="full">Email（登入帳號）<input type="email" name="email" value="${esc(u.id||"")}" ${isNew?"required":"disabled"} autocomplete="off"></label>
    ${isNew?`<label class="full">初始密碼（至少 6 個字）<input type="text" name="pw" minlength="6" autocomplete="new-password" required></label>`:""}
    <label>權限<select name="role" ${locked?"disabled":""}>${Object.entries(ROLES).map(([k,v])=>opt(k,v,(owner?"admin":u.role||"staff")===k)).join("")}</select></label>
    <label>狀態<select name="active" ${locked?"disabled":""}>${opt("1","啟用",u.active!==false)}${opt("0","停用",u.active===false)}</select></label>
  </div>
  ${isNew?'<div class="note">建立後請把 Email 和初始密碼告訴同事，並請他登入後用「忘記密碼」自行改成新密碼。</div>':""}
  ${locked?'<div class="note">'+(owner?"系統擁有者固定為管理員。":"不能變更自己的權限或停用自己。")+'</div>':""}
  <div class="actions">${!isNew?'<button class="btn" type="button" id="resetPw">寄重設密碼信</button>'+(!locked?'<button class="btn danger" type="button" id="del">移除</button>':"")+'<span class="spacer"></span>':""}<button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">${isNew?"建立帳號":"儲存"}</button></div>`,
  async fd=>{
    const d={name:val(fd,"name"),mobile:val(fd,"mobile"),role:locked?(owner?"admin":u.role||"staff"):val(fd,"role"),active:locked?true:fd.get("active")==="1",updatedAt:new Date().toISOString(),updatedBy:me.email};
    if(!d.name){showErr({message:"請填寫姓名。"});return false}
    if(isNew){
      const email=val(fd,"email").toLowerCase(),pw=String(fd.get("pw")||"");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){showErr({message:"Email 格式不正確。"});return false}
      if(pw.length<6){showErr({message:"初始密碼至少需要 6 個字。"});return false}
      if(S.staff.some(x=>x.id===email)){showErr({message:"這個 Email 已經有帳號了。"});return false}
      let existed=false;
      try{
        if(!authSecondary)authSecondary=getAuth(initializeApp(firebaseConfig,"secondary"));
        await createUserWithEmailAndPassword(authSecondary,email,pw);await signOut(authSecondary);
      }catch(err){
        if(err.code==="auth/email-already-in-use")existed=true;
        else{showErr({message:({"auth/weak-password":"密碼太簡單，請至少 6 個字。","auth/invalid-email":"Email 格式不正確。"})[err.code]||"建立帳號失敗："+(err.code||err.message)});return false}
      }
      await setDoc(doc(fs,"staff",email),{...d,createdAt:new Date().toISOString(),createdBy:me.email});
      toast(existed?"此 Email 已有登入帳號，已開通權限（密碼沿用原本的）":"已建立帳號 "+email);
    }else{await setDoc(doc(fs,"staff",u.id),d,{merge:true});toast("已儲存")}
  });
  const rp=form.querySelector("#resetPw");if(rp)rp.onclick=async()=>{try{await sendPasswordResetEmail(auth,u.id);toast("已寄出重設密碼信到 "+u.id)}catch(e){showErr({message:"寄送失敗，請稍後再試。"})}};
  if(!isNew&&!locked)confirmDelete("#del","帳號",()=>deleteDoc(doc(fs,"staff",u.id)));
}
$("#main").addEventListener("click",e=>{if(e.target.closest("[data-newacc]")){accountForm(null);return}
  const r=e.target.closest("[data-acc]");if(r){const u=S.staff.find(x=>x.id===r.dataset.acc);if(u)accountForm(u)}});
$("#main").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest("[data-acc]");if(r){const u=S.staff.find(x=>x.id===r.dataset.acc);if(u)accountForm(u)}}});

/* ---------- 功能選單 ---------- */
const WHEEL_COLORS=["#c0504d","#9bbb59","#8064a2","#4bacc6","#f79646"];
const MODULES=[
  {k:"cust",lb:"客戶|通聯",nm:"客戶通聯",ds:"客戶資料、聯絡人與電話",go:"customers"},
  {k:"quote",lb:"業務|報價",nm:"業務報價",ds:"建立報價單、列印、客戶簽名",go:"quotes"},
  {k:"order",lb:"訂單|管理",nm:"訂單管理",ds:"訂單建立與出貨追蹤"},
  {k:"rental",lb:"設備租賃|管理",nm:"設備租賃管理",ds:"設備、租約、續約與歸還",go:"overview"},
  {k:"po",lb:"採購|申購",nm:"採購／申購",ds:"申購單、採購單與簽核"},
  {k:"inv",lb:"進銷存",nm:"進銷存",ds:"庫存、進貨與銷貨"},
  {k:"acct",lb:"財會|稅務",nm:"財會稅務",ds:"應收應付、發票與稅務"},
  {k:"hr",lb:"人事|管理",nm:"人事管理",ds:"員工資料、出勤與請假"},
  {k:"cal",lb:"後勤|行事曆",nm:"後勤行事曆",ds:"公司行程與後勤排程"},
  {k:"car",lb:"派車任務|管理",nm:"派車任務管理",ds:"派車、出勤任務與回報"},
  {k:"remind",lb:"溫馨|提醒",nm:"溫馨提醒",ds:"租約到期與逾期提醒",go:"remind"},
  {k:"news",lb:"公告區",nm:"公告區",ds:"公司公告與通知"}
];
function moduleStat(m){
  if(!db)return"";
  if(m.k==="cust")return S.customers.length+" 位客戶";
  if(m.k==="quote"){const n=S.quotes.filter(x=>x.status==="draft"||x.status==="sent").length;return n?n+" 張報價進行中":S.quotes.length+" 張報價單"}
  if(m.k==="rental")return S.contracts.filter(c=>c.status==="租賃中").length+" 筆出租中";
  if(m.k==="remind"){const n=remindList().length;return n?n+" 筆需要處理":"目前沒有提醒"}
  return"";
}
function renderMenu(){
  const el=$("#tiles");if(!el||$("#menuView").hidden)return;
  const N=MODULES.length,R=40,pos=i=>{const a=(-90+i*360/N)*Math.PI/180;return[50+R*Math.cos(a),50+R*Math.sin(a)]};
  const col=i=>WHEEL_COLORS[i%WHEEL_COLORS.length];
  const arcs=MODULES.map((m,i)=>{const[x1,y1]=pos(i),[x2,y2]=pos((i+1)%N);return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${col(i+1)}" stroke-width="1.6"/>`}).join("");
  const nodes=MODULES.map((m,i)=>{
    const[x,y]=pos(i),ready=!!m.go,stat=ready?moduleStat(m):"建置中",n=m.k==="remind"&&db?remindList().length:0;
    return `<button class="node${ready?"":" soon"}" type="button" data-mod="${m.k}" style="--c:${col(i)};left:${x}%;top:${y}%" title="${esc(m.nm+"："+m.ds+(stat?"（"+stat+"）":""))}" aria-label="${esc(m.nm+(ready?"":"（建置中）"))}">
      <span>${m.lb.split("|").map(esc).join("<br>")}</span>${n?`<span class="badge mono">${n}</span>`:""}</button>`}).join("");
  el.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">${arcs}</svg><div class="hub"><b>ERP</b><small>大森節能</small></div>${nodes}`;
}
function showMenu(){$("#appView").hidden=true;$("#menuView").hidden=false;if(dlg.open)dlg.close();renderMenu();window.scrollTo(0,0)}
function openModule(k){
  const m=MODULES.find(x=>x.k===k);if(!m)return;
  if(!m.go){toast("「"+m.nm+"」功能建置中，敬請期待");return}
  $("#menuView").hidden=true;$("#appView").hidden=false;
  if(m.go==="remind"){tab="overview";q="";render();if(remindList().length)showReminders();else toast("目前沒有需要處理的提醒")}
  else{tab=m.go;q="";filter="all";render()}
  window.scrollTo(0,0);
}
$("#tiles").addEventListener("click",e=>{const t=e.target.closest("[data-mod]");if(t)openModule(t.dataset.mod)});
$("#menuBtn").onclick=showMenu;
$("#logoutBtn2").onclick=()=>signOut(auth);

/* ---------- 進入首頁 ---------- */
(()=>{const sp=$("#splash");let gone=false;
  const enter=()=>{if(gone)return;gone=true;sp.classList.add("leave");setTimeout(()=>sp.remove(),400);const f=$("#loginView:not([hidden]) input");if(f)setTimeout(()=>f.focus(),420)};
  sp.addEventListener("click",enter);
  document.addEventListener("keydown",e=>{if(!gone&&(e.key==="Enter"||e.key===" ")){e.preventDefault();enter()}});
  $("#enterBtn").focus();
})();

/* ---------- data (Firebase) ---------- */
const wrap=r=>({set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)});
const fsdb={
  collection:n=>({
    onSnapshot:(next,err)=>onSnapshot(collection(fs,n),{includeMetadataChanges:true},snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:snap.metadata}),err),
    doc:id=>wrap(id?doc(fs,n,id):doc(collection(fs,n)))
  }),
  doc:p=>wrap(doc(fs,p))
};
let dbMsg="正在連線資料庫…", unsubs=[];
function startData(){
  db=fsdb; canWrite=me.role!=="viewer"; startData.reminded=false;
  const timer=setTimeout(()=>{$("#sync").textContent="暫時無法取得最新資料，請檢查網路"},10000);
  const fresh={};
  for(const name of ["equipment","customers","contracts","quotes"]){
    unsubs.push(db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[name]=true;
      if(!snap.metadata.fromCache)fresh[name]=true;
      if(Object.keys(fresh).length===4){clearTimeout(timer);$("#sync").textContent="已同步 · 多人即時共用";if(!startData.reminded){startData.reminded=true;setTimeout(autoRemind,300)}}
      if(!dlg.open)render();
    },err=>{clearTimeout(timer);S.loaded[name]=true;$("#sync").textContent=err.code==="permission-denied"?"此帳號沒有存取權限":"資料連線中斷，請重新整理頁面";render()}));
  }
  if(me.role==="admin")unsubs.push(onSnapshot(collection(fs,"staff"),snap=>{S.staff=snap.docs.map(d=>({id:d.id,...d.data()}));if(!dlg.open)render()},()=>{}));
  render();
}
function stopData(){unsubs.forEach(u=>u());unsubs=[];db=null;S.equipment=[];S.customers=[];S.contracts=[];S.quotes=[];S.staff=[];me=null;for(const k in S.loaded)S.loaded[k]=false}
const loginErr=t=>{const e=$("#loginErr");e.textContent=t;e.hidden=!t};
const authMsg=c=>({"auth/invalid-credential":"Email 或密碼錯誤。","auth/invalid-email":"Email 格式不正確。","auth/too-many-requests":"嘗試次數太多，請稍後再試。","auth/network-request-failed":"網路連線失敗，請檢查網路。","auth/missing-password":"請輸入密碼。"})[c]||"登入失敗，請再試一次。";
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();loginErr("");const b=$("#loginBtn");b.disabled=true;
  try{await signInWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPw").value)}catch(err){loginErr(authMsg(err.code))}finally{b.disabled=false}});
$("#resetBtn").onclick=async()=>{const em=$("#loginEmail").value.trim();if(!em){loginErr("請先輸入 Email，再按忘記密碼。");return}
  try{await sendPasswordResetEmail(auth,em);loginErr("");toast("已寄出重設密碼信，請到信箱收信")}catch(err){loginErr(authMsg(err.code))}};
$("#logoutBtn").onclick=()=>signOut(auth);
dlg.addEventListener("close",()=>render());
onAuthStateChanged(auth,async u=>{
  stopData();
  if(!u){$("#appView").hidden=true;$("#menuView").hidden=true;$("#loginView").hidden=false;return}
  const email=String(u.email).toLowerCase();
  let info=null;
  try{const snap=await getDoc(doc(fs,"staff",email));if(snap.exists())info=snap.data()}catch(err){}
  if(email===OWNER)info={...(info||{}),role:"admin",active:true};
  if(!info||info.active===false){await signOut(auth);loginErr(info?"此帳號已停用，請聯絡管理員。":"此帳號尚未開通，請聯絡管理員。");return}
  me={email,name:info.name||"",mobile:info.mobile||"",role:ROLES[info.role]?info.role:"staff"};
  $("#whoami").textContent=$("#whoami2").textContent=(me.name||email)+" · "+ROLES[me.role];$("#loginView").hidden=true;$("#appView").hidden=true;$("#menuView").hidden=false;startData();
});
</script>
