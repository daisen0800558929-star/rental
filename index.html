<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa0">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="大森ERP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>大森租賃管理系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sheet.css">
<script src="lib/qrcode.js"></script>
<style>
/* Layout: sticky header + tab bar, one-column work list; stat strip on overview; dialog forms */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#dde2ea; --fg:#1b2230; --muted:#5d6779;
  --accent:#1f4fa0; --accent-soft:#e6edf8; --on-accent:#ffffff;
  --ok:#1d7a4c; --ok-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b4282c; --bad-soft:#fae4e4;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:12px 8px;flex-wrap:wrap}
.head>div:first-child{min-width:0;flex:1 1 220px}
@media (max-width:600px){.head .userbox #whoami{display:none}.head .userbox{justify-content:flex-start}}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.addr{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.addr-t{font-size:13px;color:var(--fg);font-weight:500;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.addr .inl{display:inline-flex;flex-direction:row;align-items:center;gap:6px;font-weight:400;color:var(--muted)}
.addr .inl input{width:auto}
.taxchk{display:grid;gap:6px;margin-top:-4px}
.taxchk .inl{display:inline-flex;flex-direction:row;align-items:center;gap:6px;color:var(--muted)}
.taxchk .inl input{width:auto}
.micbox{position:relative;display:block}
.micbox>input,.micbox>textarea{padding-right:44px}
.mic{position:absolute;right:5px;top:5px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.mic:hover{background:var(--accent-soft);color:var(--accent)}
.mic:focus-visible{outline:2px solid var(--accent)}
.mic.on{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:micpulse 1.1s ease-in-out infinite}@keyframes micpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 30%,transparent)}}}
.addr-mic{display:inline-flex;align-items:center;gap:4px}
/* 人事管理 */
.vis{display:grid;gap:16px}
.vis .lead{font-size:clamp(20px,4.2vw,28px);font-weight:700;line-height:1.4;text-wrap:balance;margin:0}
.vis h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.vis p{margin:0;white-space:pre-wrap;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-weight:500}
.org{overflow-x:auto;padding:4px 2px 12px}
.org ul{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.org>ul{padding-left:0}
.org li{position:relative;padding:6px 0 6px 18px}
.org>ul>li{padding-left:0}
.org ul ul li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.org ul ul li:last-child::before{bottom:auto;height:26px}
.org ul ul li::after{content:"";position:absolute;left:0;top:26px;width:16px;border-top:1px solid var(--line)}
.ocard{display:inline-grid;gap:1px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:7px 12px;min-width:150px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.ocard:hover{background:var(--accent-soft)}
.ocard b{font-size:14.5px}.ocard small{color:var(--muted);font-size:12px}
table.grid{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
table.grid th{color:var(--muted);font-weight:500;font-size:12.5px;background:var(--bg)}
table.grid td.n,table.grid th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
table.grid tr.dept td{background:var(--bg);font-weight:700;color:var(--fg);font-size:14px}
table.grid tr[data-pos]{cursor:pointer}table.grid tr[data-pos]:hover td{background:var(--accent-soft)}
fieldset.adm{border-color:var(--warn)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:88px 18px minmax(0,1fr);gap:0 10px}
.tl .yr{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right;padding-top:14px}
.tl .ax{position:relative}.tl .ax::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl .ax::after{content:"";position:absolute;left:3px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px var(--bg)}
.tl li:first-child .ax::before{top:16px}.tl li:last-child .ax::before{bottom:calc(100% - 22px)}
.tl .hc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:6px 0;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.tl .hc:hover{border-color:var(--accent)}
.tl .hc b{font-size:15px}.tl .hc img{max-height:140px;max-width:100%;border-radius:4px;justify-self:start;background:#fff}
@media (max-width:520px){.tl li{grid-template-columns:72px 16px minmax(0,1fr);gap:0 6px}.tl .yr{font-size:11px;white-space:nowrap}}
.miss{color:var(--bad);font-size:12.5px;font-weight:500;white-space:nowrap}
.misslist{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 14px;font-size:13.5px}
.qwrap{position:relative;flex:1 1 180px;min-width:0;display:block}
.qwrap>input{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:min(60vh,360px);overflow:auto;padding:4px}
.sugg button{display:grid;gap:1px;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg small{color:var(--muted);font-size:12px}
.sugg mark{background:none;color:var(--accent);font-weight:700}
.sugg .kind{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.deal{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border-radius:8px;padding:9px 12px;font-size:13.5px}
.deal b{font-size:14.5px}
.deal.ok{background:var(--ok-soft);color:var(--ok)}
.deal.warn{background:var(--warn-soft);color:var(--warn)}
.deal span{color:var(--fg);opacity:.85}
.permbox{display:grid;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.perm-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px}
.permbox .inl{display:inline-flex;flex-direction:row;align-items:center;gap:6px;color:var(--fg)}.permbox .inl input{width:auto}
.coderule{display:grid;gap:6px;background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:13.5px;line-height:1.6}
.coderule .addr-t{justify-content:space-between}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;justify-self:start;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
main{padding-block:18px 48px;display:grid;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{flex:1 1 180px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:500;padding:9px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
section h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--bg);color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.dlg{display:grid;gap:14px;padding:18px}
.dlg h3{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .spacer{flex:1}
.calc{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
dialog.wide{width:min(980px,calc(100vw - 32px))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.items{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.items th{background:var(--bg);color:var(--muted);font-weight:500;font-size:12.5px;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.items td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items td input{padding:7px 8px}
table.items .num{text-align:right}
table.items.norent{min-width:960px!important}
table.items.norent tr>:nth-child(6),table.items.norent tr>:nth-child(7){display:none}
table.items td.idx{color:var(--muted);text-align:center;width:36px}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 18px;font-size:14px}
.totals .grand{font-size:17px;font-weight:700}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0;min-width:0}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.sheet-wrap{border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;background:var(--surface)}
.sheet-wrap .sheet{min-width:700px}
/* 轉 PDF / 圖片時的離屏畫布：固定 A4 寬度、白底黑字 */
.sheet-render{position:fixed;left:-12000px;top:0;width:760px;padding:17px;background:#fff}
.sheet-render .sheet,#printArea .sheet,.sheet.light{--ink:#000;--rule:#444;--fg:#000;--surface:#fff;background:#fff;color:#000}
.histbox{background:var(--ok-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.histbox select{width:100%}
.sendopts{display:grid;gap:10px}
.sendopts button{text-align:left;display:grid;gap:2px;padding:12px 14px}
.sendopts button .note{font-weight:400}
.linkbox{font-family:var(--font-mono);font-size:12.5px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.scanview{max-width:100%;display:block;margin:0 auto;border:1px solid var(--line);background:#fff}
.sigpad{width:100%;height:220px;background:#fff;border:1px dashed var(--muted);border-radius:6px;touch-action:none;display:block}
#printArea{display:none}
@media print{
  @page{size:A4;margin:9mm 10mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .sheet-wrap{border:0;padding:0;overflow:visible}
  #printArea .sheet{min-width:0}
}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%);display:grid;gap:14px;box-sizing:border-box}
.login h1{font-size:21px}
.userbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.userbox .sub{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 內容分析 */
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.an-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{margin:0;font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.hb{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{display:block;height:12px;background:var(--bg);border-radius:0 4px 4px 0;overflow:hidden}
.hb .bar{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb .vl{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.vb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;height:170px;border-bottom:1px solid var(--line);padding-top:18px}
.vb .col{display:grid;grid-template-rows:auto 1fr;height:100%;align-items:end;justify-items:center;gap:4px;min-width:0}
.vb .v{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.vb .b{display:block;width:min(38px,70%);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;align-self:end}
.vb-x{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;font-size:12px;color:var(--muted);text-align:center}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.stack span{min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modlist{display:grid;gap:0}
.modlist .row{cursor:default;grid-template-columns:minmax(0,1fr) auto}
.modlist .row[data-mod]{cursor:pointer}
/* 選擇部門 */
.dept-main{padding-block:26px 48px;display:grid;gap:18px;justify-items:center}
.dept-main h2{margin:0;font-size:20px;text-align:center}
.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(560px,100%)}
.dept-btn{appearance:none;border:2px solid var(--c);background:var(--surface);color:var(--text);border-radius:14px;min-height:118px;font:inherit;font-size:22px;font-weight:700;letter-spacing:.12em;cursor:pointer;display:grid;place-items:center;gap:4px;padding:14px;transition:transform .12s,background .12s}
.dept-btn small{font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted)}
.dept-btn:hover,.dept-btn:focus-visible{background:color-mix(in srgb,var(--c) 14%,var(--surface));transform:translateY(-2px)}
.dept-btn.on{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
@media (max-width:420px){.dept-btn{min-height:104px;font-size:20px}}
/* 功能選單 */
.menu-top{background:var(--surface);border-bottom:1px solid var(--line)}
.menu-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.menu-top img{height:40px;width:auto;background:#fff;border-radius:4px;display:block}
.menu-main{padding-block:22px 48px;display:grid;gap:16px}
.menu-main h2{margin:0;font-size:18px}
.wheel-wrap{container-type:inline-size;width:min(640px,100%);margin:0 auto}
.wheel{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;cursor:pointer;
  background:var(--c);color:#fff;font:inherit;font-weight:700;font-size:clamp(10px,3.1cqw,19px);line-height:1.25;
  display:grid;place-items:center;text-align:center;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.18);box-sizing:border-box}
.node span{display:block;overflow-wrap:anywhere}
.node.soon{background:color-mix(in srgb,var(--c) 62%,var(--bg));color:rgba(255,255,255,.95)}
.node:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.node{transition:transform .15s ease,opacity .15s}.node:hover{transform:translate(-50%,-50%) scale(1.08)}}
.node .badge{position:absolute;top:2%;right:2%;min-width:1.6em;height:1.6em;border-radius:999px;background:#fff;color:#b4282c;font-size:.8em;display:grid;place-items:center;padding:0 .3em;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hub{border:0;font:inherit;cursor:pointer;position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#4a7ebb;color:#fff;
  display:grid;place-content:center;text-align:center;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.hub b{font-size:clamp(20px,8cqw,52px);letter-spacing:.02em;line-height:1}
.hub small{font-size:clamp(10px,2.6cqw,16px);opacity:.9}
.hub .hub-sub{font-size:clamp(9px,2.2cqw,13px);opacity:.85;border-top:1px solid rgba(255,255,255,.45);padding-top:3px;margin-top:2px}
.hub:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
@media (prefers-reduced-motion:no-preference){.hub{transition:transform .15s}.hub:hover{transform:translate(-50%,-50%) scale(1.04)}}
.wheel-note{text-align:center;font-size:12.5px;color:var(--muted)}
#splash{position:fixed;inset:0;z-index:50;background:#ffffff;display:grid;place-items:center;cursor:pointer;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#splash button{border:0;background:none;padding:0;cursor:pointer;border-radius:12px}
#splash button:focus-visible{outline:3px solid #1f4fa0;outline-offset:8px}
#splash img{width:min(520px,82vw);height:auto;display:block}
#splash.leave{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #splash{transition:opacity .35s ease}
  #splash img{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
}

/* 計費：日租 = 天數 × 單價；月租 = 以 30 天為一期，不足一期以一期計 */
function rentDays(c){const end=c.status==="已歸還"&&c.returnDate?c.returnDate:c.end;return Math.max(1,daysBetween(c.start,end)+1)}
function rentAmount(c){const d=rentDays(c);return c.unit==="月"?Math.ceil(d/30)*(+c.rate||0):d*(+c.rate||0)}
/* 到期提醒天數：每筆租約可自訂，預設 7 天 */
const remindOf=c=>{const n=parseInt(c.remindDays,10);return Number.isFinite(n)&&n>=0?n:7};
function cState(c){
  if(c.status==="已歸還")return{label:"已歸還",cls:"mute",k:"done"};
  if(c.status==="已取消")return{label:"已取消",cls:"mute",k:"done"};
  const t=todayStr();
  if(c.start>t)return{label:"未開始",cls:"",k:"future"};
  const left=daysBetween(t,c.end);
  if(left<0)return{label:"逾期 "+(-left)+" 天",cls:"bad",k:"overdue"};
  if(left<=remindOf(c))return{label:left===0?"今日到期":left+" 天後到期",cls:"warn",k:"soon"};
  return{label:"租賃中",cls:"ok",k:"active"};
}

function hl(t,qq){t=String(t||"");const i=nz(t).indexOf(qq);return i<0||!qq?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+qq.length))+"</mark>"+esc(t.slice(i+qq.length))}
function attachSuggest(si){
  const wrap=document.createElement("span");wrap.className="qwrap";si.before(wrap);wrap.appendChild(si);
  si.setAttribute("autocomplete","off");si.setAttribute("enterkeyhint","search");
  const box=document.createElement("div");box.className="sugg";box.hidden=true;box.setAttribute("role","listbox");wrap.appendChild(box);
  let items=[],sel=-1,composing=false,timer=null;
  const show=()=>{const qq=nz(si.value.trim());if(!qq){box.hidden=true;return}
    const seen=new Set();items=suggestItems().filter(it=>it.keys.includes(qq)).filter(it=>{const k=it.kind+"|"+it.title+"|"+it.sub;if(seen.has(k))return false;seen.add(k);return true})
      .sort((a,b)=>(nz(a.title).startsWith(qq)?0:1)-(nz(b.title).startsWith(qq)?0:1)).slice(0,8);
    sel=-1;
    box.innerHTML=items.length?items.map((it,i)=>`<button type="button" role="option" data-i="${i}"><span><span class="kind">${esc(it.kind)}</span>${hl(it.title,qq)}</span>${it.sub?`<small>${hl(it.sub,qq)}</small>`:""}</button>`).join(""):'<div class="note" style="padding:8px 10px">找不到符合「'+esc(si.value.trim())+'」的資料</div>';
    box.hidden=false};
  const apply=()=>{q=si.value;clearTimeout(timer);timer=setTimeout(()=>{const pos=si.selectionStart;render();const el=$("#q");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},250)};
  const pick=i=>{const it=items[i];if(!it)return;si.value=it.val;q=it.val;box.hidden=true;render();const el=$("#q");if(el)el.blur()};
  si.addEventListener("compositionstart",()=>composing=true);
  si.addEventListener("compositionend",()=>{composing=false;show();apply()});
  si.addEventListener("input",e=>{show();if(composing||e.isComposing)return;apply()});
  si.addEventListener("focus",()=>{if(si.value.trim())show()});
  si.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,180));
  si.addEventListener("keydown",e=>{if(box.hidden||!items.length)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;box.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===sel))}
    else if(e.key==="Enter"&&sel>=0){e.preventDefault();pick(sel)}else if(e.key==="Escape")box.hidden=true});
  box.addEventListener("mousedown",e=>e.preventDefault());
  box.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)pick(+b.dataset.i)});
  if(document.activeElement===si&&si.value.trim())show();
}

}

const dlg=$("#dlg"),form=$("#dlgForm");
let onSubmit=null;
function openDlg(html,submit,wide){form._cf=null;dlg.classList.toggle("wide",!!wide);form.oninput=null;form.innerHTML=html;onSubmit=submit;dlg.showModal();const f=form.querySelector("input,select,textarea");if(f)f.focus();setTimeout(addDial,0)}
/* 電話欄位旁加「撥打」：手機上點了直接撥號（分機 #12 會自動在接通後撥出） */
const telHref=v=>{v=String(v||"").trim();if(!v)return"";const m=v.split(/[#＃轉]|分機|ext/i),main=m[0].replace(/[^\d+]/g,""),ext=(m[1]||"").replace(/\D/g,"");return main.length>=6?"tel:"+main+(ext?","+ext:""):""};
function addDial(){form.querySelectorAll('input[name=tel],input[name=mobile],input[name=phone],input[name=c_phone],input[name=c_mobile],input[name=salesMobile],input[name$=_phone]').forEach(inp=>{
  if(inp.dataset.dial)return;inp.dataset.dial=1;const a=document.createElement("a");a.className="btn small";a.textContent="📞 撥打";a.style.cssText="justify-self:start;margin-top:4px;text-decoration:none";
  const up=()=>{const h=telHref(inp.value);a.hidden=!h;if(h)a.href=h};up();inp.addEventListener("input",up);inp.addEventListener("change",up);
  const host=inp.closest(".micbox")||inp;host.insertAdjacentElement("afterend",a)})}
form.addEventListener("submit",async e=>{e.preventDefault();if(!onSubmit)return;const btn=form.querySelector("[type=submit]");if(btn)btn.disabled=true;
  try{const ok=await onSubmit(new FormData(form));if(ok!==false)dlg.close()}catch(err){showErr(err)}finally{if(btn)btn.disabled=false}});
form.addEventListener("click",e=>{if(e.target.closest("[data-close]"))dlg.close()});
function showErr(err){let el=form.querySelector(".formerr");if(!el){el=document.createElement("div");el.className="banner formerr";form.prepend(el)}
  el.textContent=(err?.code==="permission-denied"||err?.code==="invalid_argument")?"你目前沒有修改權限，無法儲存。":err?.code==="quota_exceeded"?"資料已達上限，請先刪除部分舊資料。":(err?.message||"儲存失敗，請再試一次。")}

/* ---------- 統編驗證：檢查碼 + 經濟部商工登記查詢 ---------- */
const TAX_EXEMPT=["政府機關","部隊","境外公司","其他單位"];
function taxChecksum(no){
  if(!/^\d{8}$/.test(no))return false;
  const w=[1,2,1,2,1,2,4,1];let s=0;
  for(let i=0;i<8;i++){const p=+no[i]*w[i];s+=Math.floor(p/10)+p%10}
  return s%5===0||(no[6]==="7"&&(s+1)%5===0);
}
const normName=n=>String(n||"").normalize("NFKC").replace(/[\s　]/g,"").replace(/臺/g,"台");
const taxCache={};
async function fetchJSON(url,ms=15000){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error("HTTP "+r.status);const tx=await r.text();return tx.trim()?JSON.parse(tx):null}finally{clearTimeout(t)}}
/* 依序查詢：經濟部公司登記 → 經濟部商業(行號)登記 → g0v 公司資料 */
/* 已驗證過的統編：本機快取 30 天、系統內已驗證的客戶資料 */
function knownTax(no){
  try{const c=JSON.parse(localStorage.getItem("tax:"+no)||"null");if(c&&Date.now()-c.t<30*864e5)return{found:true,name:c.name,status:c.status,kind:c.kind,cached:true}}catch(e){}
  const k=S.customers.find(x=>x.taxId===no&&x.taxVerified&&!x.taxExempt);
  return k?{found:true,name:k.name,status:"",kind:"",cached:true,from:"系統客戶資料"}:null;
}
async function lookupTax(no,force){
  if(!force&&taxCache[no])return taxCache[no];
  const live=await lookupTaxLive(no);
  if(live.found){try{localStorage.setItem("tax:"+no,JSON.stringify({name:live.name,status:live.status,kind:live.kind,t:Date.now()}))}catch(e){}return live}
  if(live.error){const k=knownTax(no);if(k)return k}
  return live;
}
// 商業登記申登機關代碼（各縣市政府）
const BIZ_AGENCY=["","387000000A","376470000A","380000000A","379000000A","382000000A","395000000A","397000000A","376480000A","376490000A","376450000A","376440000A","376580000A","376500000A","376600000A","376530000A","376420000A","376550000A","376540000A","376560000A","376570000A","371020000A","371030000A","376610000A","376430000A"];
async function lookupTaxLive(no){
  const G="https://data.gcis.nat.gov.tw/od/data/api/",q=f=>"?$format=json&$filter="+encodeURIComponent(f)+"&$skip=0&$top=1";
  const src=[
    async()=>{const j=await fetchJSON(G+"5F64D864-61CB-4D0D-8AD9-492047CC1EA6"+q("Business_Accounting_NO eq "+no));const r=Array.isArray(j)?j[0]:null;return r?.Company_Name?{name:r.Company_Name,status:r.Company_Status_Desc||"",kind:"公司"}:null},
    // 商業(行號、企業社)登記：經濟部要求同時帶「申登機關」代碼，所以各縣市一起查，取有資料的那一筆
    async()=>{const one=async ag=>{const j=await fetchJSON(G+"7E6AFA72-AD6A-46D3-8681-ED77951D912D"+q("President_No eq "+no+(ag?" and Agency eq "+ag:"")));const r=Array.isArray(j)?j[0]:null;if(r?.Business_Name)return{name:r.Business_Name,status:r.Business_Current_Status_Desc||"",kind:"商號",addr:r.Business_Address||""};throw 0};
      try{return await Promise.any(BIZ_AGENCY.map(one))}catch(e){if(e?.errors?.every(x=>x===0))return null;throw e}},
    // 財政部營業(稅籍)登記：企業社、行號、分公司都有
    async()=>{const j=await fetchJSON("https://eip.fia.gov.tw/OAI/api/businessRegistration/"+no);const r=Array.isArray(j)?j[0]:j;if(!r||typeof r!=="object")return null;
      const key=Object.keys(r).find(k=>/^(businessNm|banNm|businessName|name|營業人名稱)$/i.test(k))||Object.keys(r).find(k=>/(Nm|Name|名稱)$/i.test(k)&&!/head|resp|負責/i.test(k));
      const n=key&&String(r[key]||"").trim();return n?{name:n,status:r.businessStatus||r.status||"",kind:"稅籍"}:null},
    async()=>{const j=await fetchJSON("https://company.g0v.ronny.tw/api/show/"+no);const d=j?.data;const n=d&&(d["公司名稱"]||d["商業名稱"]||d["名稱"]);return n?{name:Array.isArray(n)?n[0]:n,status:d["公司狀況"]||d["現況"]||"",kind:d["商業名稱"]?"商號":"公司"}:null}
  ];
  let reached=false;
  for(const f of src){try{const r=await f();reached=true;if(r){return taxCache[no]={found:true,...r}}}catch(e){console.warn("統編查詢來源失敗",e)}}
  if(!reached&&!lookupTaxLive.retrying){lookupTaxLive.retrying=true;try{await new Promise(r=>setTimeout(r,1200));return await lookupTaxLive(no)}finally{lookupTaxLive.retrying=false}}
  const res=reached?{found:false}:{error:true};if(reached)taxCache[no]=res;return res;
}
/* 綁定表單：nameF 公司名稱欄、taxF 統編欄、P 前綴 */
function taxBlock(P,ex){return `<div class="full taxchk" id="${P}_taxbox"><div class="note" id="${P}_taxmsg"></div>
  <label class="inl"><input type="checkbox" name="${P}_exempt" ${ex?"checked":""}> 政府機關、部隊、境外公司或其他單位（免驗證統編）</label>
  <select name="${P}_exemptType" ${ex?"":"hidden"} style="max-width:220px">${TAX_EXEMPT.map(t=>opt(t,t,t===ex)).join("")}</select></div>`}
function bindTax(P,nameF,taxF){
  const F=form.elements,nm=F[nameF],tx=F[taxF],ex=F[P+"_exempt"],et=F[P+"_exemptType"],msg=$("#"+P+"_taxmsg");

  const show=(t,c)=>{msg.innerHTML=t;msg.style.color=c==="ok"?"var(--ok)":c==="bad"?"var(--bad)":"var(--muted)"};
  const check=async()=>{
    const no=tx.value.replace(/\D/g,"").slice(0,8);if(tx.value!==no)tx.value=no;
    st.ok=false;st.info=null;

    if(!taxChecksum(no)){show("✕ 統編檢查碼錯誤，請確認是否輸入正確","bad");return}
    show("查詢經濟部登記資料中…");
    const p=st.pending=lookupTax(no);const r=await p;if(st.pending!==p)return;st.pending=null;
    if(tx.value!==no||ex.checked)return check();
    st.info=r;
    if(r.error){show(`✕ 經濟部查詢網站暫時沒有回應（政府網站偶爾較慢或維護中）　<button class="btn small" type="button" data-retrytax="${P}">重新查詢</button>`,"bad");return}
    if(!r.found){
      if(st.manual===no&&nm.value.trim()){show(`已手動確認：線上查不到此統編，使用輸入的公司名稱「${esc(nm.value.trim())}」`);st.ok=true;return}
      show(`✕ 線上查不到此統編的登記資料，請確認統編是否正確　<button class="btn small" type="button" data-retrytax="${P}">重新查詢</button> <button class="btn small" type="button" data-manualtax="${P}">統編確認無誤，手動輸入名稱</button>`,"bad");return}
    if(normName(r.name)!==normName(nm.value)&&st.lastNo!==no){nm.value=r.name;nm.dispatchEvent(new Event("change",{bubbles:true}))}
    st.lastNo=no;
    const same=normName(r.name)===normName(nm.value);
    if(same){show(`✓ ${r.cached?"已驗證過（"+(r.from||"本機紀錄")+"）":"已帶出登記名稱"}：${esc(r.name)}${r.status?"（"+esc(r.status)+"）":""}`,"ok");st.ok=true}
    else show(`✕ 此統編登記名稱為「${esc(r.name)}」，與輸入的公司名稱不符　<button class="btn small" type="button" data-usename="${P}">改用登記名稱</button>`,"bad");
  };
  form.addEventListener("click",e=>{const rb=e.target.closest(`[data-retrytax="${P}"]`);if(rb){const no=tx.value;delete taxCache[no];check();return}
    const mb=e.target.closest(`[data-manualtax="${P}"]`);if(mb){st.manual=tx.value;if(!nm.value.trim()){nm.focus();show("請在「公司名稱」輸入正確名稱");return}check();return}
    const b=e.target.closest(`[data-usename="${P}"]`);if(b&&st.info?.name){nm.value=st.info.name;nm.dispatchEvent(new Event("input",{bubbles:true}));check()}});
  let t=null;const later=()=>{clearTimeout(t);t=setTimeout(check,350)};
  tx.addEventListener("input",later);nm.addEventListener("input",later);nm.addEventListener("change",later);
  ex.addEventListener("change",()=>{et.hidden=!ex.checked;check()});et.addEventListener("change",check);
  st.run=check;check();

  m=flat.replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g,"").match(/(?:https?:\/\/)?www\.[\w-]+(?:\.[\w-]+)+/i);if(m)o.website=normUrl(m[0]);

    if(/傳真|fax|F[:：]/i.test(l)){if(!o.fax)o.fax=fmtTel(t[0])}else if(!o.phone)o.phone=fmtTel(t[0])}

  const addrLine=lines.find(l=>/地址|address/i.test(l)&&cty.some(c=>l.includes(c)))||lines.find(l=>cty.some(c=>l.includes(c))&&/[路街道段號]/.test(l));
  /* 沒寫縣市時，用郵遞區號或鄉鎮名稱推回縣市 */

    if(l){let a=strip(l).replace(/\s/g,"");const zm=a.match(/^(\d{3})(?:\d{2,3})?/);let hit=null;const rest=zm?a.slice(zm[0].length):a;

  // 公司名稱
  const co=lines.filter(l=>/(股份有限公司|有限公司|企業社|工作室|商行|工廠|實業|企業|公司|行)$/.test(strip(l).replace(/\s/g,""))&&!/地址|電話|傳真/.test(l)).map(l=>strip(l).replace(/\s/g,""));

  const DEPT=/^(工務|業務|行銷|技術|客服|採購|研發|財務|會計|行政|總務|品管|品保|生管|資訊|工程|營業|銷售|管理|人事|設計|製造|生產|物流|倉管|廠務|專案|資深|高級|首席|區域)$/;
  const SURN="陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周徐蘇葉莊呂江何蕭羅高潘簡朱鍾彭游詹胡施沈余趙盧梁顏柯孫魏翁戴范宋方鄧杜傅侯曹薛丁卓阮馬董温温唐藍石蔣古紀姚連馮歐程湯黃田康姜汪白鄒尤巫鐘黎涂龔嚴韓袁金童陸夏柳邵錢伍倪溫于譚駱熊任甘秦顧毛章史官萬俞雷粘饒張闕凃龍";

  if(tparts.length){let run=[tparts[0]];for(const x of tparts.slice(1)){if(x[0]===run[run.length-1][0]+1)run.push(x);else break}o.title=run.map(x=>x[1]).join("")}

  return o;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function zhDigits(t){const m={"零":"0","〇":"0","○":"0","洞":"0","一":"1","么":"1","幺":"1","壹":"1","二":"2","兩":"2","貳":"2","三":"3","參":"3","四":"4","肆":"4","五":"5","伍":"5","六":"6","陸":"6","七":"7","拐":"7","柒":"7","八":"8","捌":"8","九":"9","勾":"9","玖":"9"};
  return String(t).replace(/[零〇○洞一么幺壹二兩貳三參四肆五伍六陸七拐柒八捌九勾玖]/g,c=>m[c])}
function voiceClean(kind,t){
  t=String(t).trim().replace(/[。．]$/,"");
  if(kind==="digits")return zhDigits(t).replace(/\D/g,"").slice(0,8);
  if(kind==="tel")return zhDigits(t).replace(/(分機|轉|井字?號?)/g,"#").replace(/[^\d#]/g,"");
  if(kind==="email")return t.replace(/小老鼠|at|艾特/gi,"@").replace(/點|dot/gi,".").replace(/底線/g,"_").replace(/槓|減號/g,"-").replace(/\s+/g,"").toLowerCase();
  return t.replace(/\s+/g,kind==="append"?" ":"");
}
let micActive=null;

function rowVoice(tr){if(!SR||!tr)return;const el=tr.querySelector("[name=i_spec]");if(!el||el.parentElement.classList.contains("micbox"))return;
  const box=document.createElement("span");box.className="micbox";el.before(box);box.appendChild(el);

  b.onclick=()=>listen(t=>{el.value=voiceClean("text",t);el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))},b)}
function listen(onText,btn){
  if(micActive){try{micActive.stop()}catch(e){}if(micActive._btn===btn){micActive=null;return}}
  const r=new SR();r.lang="zh-TW";r.interimResults=false;r.maxAlternatives=1;r._btn=btn;micActive=r;
  btn.classList.add("on");btn.setAttribute("aria-label","停止語音輸入");
  r.onresult=e=>{const t=e.results[0][0].transcript;if(t)onText(t)};
  r.onerror=e=>{toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"請允許瀏覽器使用麥克風後再試":e.error==="no-speech"?"沒有聽到聲音，請再按一次麥克風說話":"語音辨識失敗，請再試一次")};
  r.onend=()=>{btn.classList.remove("on");btn.setAttribute("aria-label","語音輸入");if(micActive===r)micActive=null};

}

function invStock(exceptId){
  const st={};const g=id=>st[id]||(st[id]={in:0,out:0,lent:0,scrap:0,adj:0,qty:0});
  for(const d of S.invDocs){if(d.id===exceptId)continue;for(const i of d.items||[]){const q=+i.qty||0,r=g(i.pid);

  async fd=>{const d={empId:val(fd,"empId"),type:val(fd,"type"),signDate:val(fd,"signDate"),start:val(fd,"start"),end:val(fd,"end"),note:val(fd,"note"),updatedAt:new Date().toISOString(),updatedBy:me.email};

  if(c.takenBy&&(!qs[0]?.sales||String(c.takenAt||"")>=String(qs[0].createdAt||qs[0].date||"")))return{st:"ok",who:c.takenBy};

function quoteCalc(q){
  const items=(q.items||[]).map(i=>({...i,sub:Math.round((+i.qty||0)*(+i.price||0))}));
  const sum=items.reduce((s,i)=>s+i.sub,0);
  const tax=q.taxMode==="excl"?Math.round(sum*0.05):0;
  const total=sum+tax,deposit=Math.round(total/2);
  return{items,sum,tax,total,deposit,balance:total-deposit};
}

/* 簽名板：回傳 {get():dataURL|null, clear()} */
function sigPad(cv){
  const ctx=cv.getContext("2d");let drawn=false,down=false;
  const size=()=>{const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#111";drawn=false};
  size();
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);ctx.beginPath();ctx.moveTo(a,b)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[a,b]=pt(e);ctx.lineTo(a,b);ctx.stroke();drawn=true});
  cv.addEventListener("pointerup",()=>down=false);cv.addEventListener("pointercancel",()=>down=false);
  return{clear:size,get:()=>drawn?cv.toDataURL("image/png"):null};
}

const loadScript=(()=>{const c={};return src=>c[src]||(c[src]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>{delete c[src];no(new Error("載入元件失敗，請檢查網路後再試一次。"))};document.head.appendChild(s)}))})();
function newToken(){const a=new Uint8Array(18);crypto.getRandomValues(a);return [...a].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,30)}
/* 建立（或延長）這張報價單的線上簽名連結，回傳最新的報價單資料 */
async function ensureSignReq(x){
  const token=x.signToken||newToken(),exp=new Date(Date.now()+SIGN_DAYS*864e5);
  const y={...x,signToken:token,signExpires:exp.toISOString(),status:x.status==="draft"||!x.status?"sent":x.status};
  await setDoc(doc(fs,"signReqs",token),{quoteId:x.id,no:x.no||"",cust:x.cust?.name||"",contact:x.cust?.contact||"",sheetHtml:quoteSheet(y,{noQr:true}),status:"open",createdAt:new Date().toISOString(),createdBy:me.email,expiresAt:Timestamp.fromDate(exp)});
  await db.doc("quotes/"+x.id).update({signToken:token,signExpires:y.signExpires,status:y.status,sentAt:new Date().toISOString()});
  return y;
}

/* 把報價單畫成 A4 圖片或 PDF */
async function renderSheet(x,kind){
  await loadScript("lib/html2canvas.min.js");
  if(kind==="pdf")await loadScript("lib/jspdf.umd.min.js");
  const box=document.createElement("div");box.className="sheet-render";box.innerHTML=quoteSheet(x,{qr:signUrl(x)});document.body.appendChild(box);
  try{
    await Promise.all([...box.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):null));
    try{await document.fonts.ready}catch(e){}
    const cv=await html2canvas(box,{scale:2,backgroundColor:"#ffffff",logging:false});
    if(kind==="png")return await new Promise(ok=>cv.toBlob(b=>ok(new File([b],fileBase(x)+".png",{type:"image/png"})),"image/png"));
    const pdf=new window.jspdf.jsPDF({orientation:"p",unit:"mm",format:"a4"});
    let w=210,h=cv.height*w/cv.width;if(h>297){h=297;w=cv.width*h/cv.height}
    pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",(210-w)/2,0,w,h);
    return new File([pdf.output("blob")],fileBase(x)+".pdf",{type:"application/pdf"});
  }finally{box.remove()}
}

/* 客戶紙本簽回：照片壓縮後存進 quoteFiles/{報價單id}（單筆上限約 1MB） */
async function fileToData(f){
  const rd=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error("讀取檔案失敗"));r.readAsDataURL(b)});
  if(f.type==="application/pdf"){if(f.size>700*1024)throw new Error("PDF 超過 700 KB，請改用手機拍照上傳。");return rd(f)}
  if(!f.type.startsWith("image/"))throw new Error("請選擇照片或 PDF 檔。");
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("無法讀取這張照片，請換一張再試。"));i.src=URL.createObjectURL(f)});
  for(const [max,qq] of [[2000,.8],[1600,.72],[1300,.65],[1000,.6]]){
    const s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
    const d=cv.toDataURL("image/jpeg",qq);if(d.length<900000)return d}
  throw new Error("照片太大，請重新拍照（不要用最高畫質）再上傳。");
}

function moduleStat(m){
  if(!db)return"";
  if(m.k==="cust"){const n=S.calls.filter(c=>String(c.at).slice(0,7)===todayStr().slice(0,7)).length;return "本月 "+n+" 筆通聯"}
  if(m.k==="quote"){const n=S.quotes.filter(x=>x.status==="draft"||x.status==="sent").length;return n?n+" 張報價進行中":S.quotes.length+" 張報價單"}
  if(m.k==="rental")return S.contracts.filter(c=>c.status==="租賃中").length+" 筆出租中";
  if(m.k==="inv"){const low=invLow().length;return S.invProd.length+" 項商品"+(low?"・"+low+" 項低庫存":"")}
  if(m.k==="hr")return "在職 "+S.hrEmp.filter(hrActive).length+" 人";
  if(m.k==="remind"){const n=remindList().length;return n?n+" 筆需要處理":"目前沒有提醒"}

}
function renderMenu(){
  const el=$("#tiles");if(!el||$("#menuView").hidden)return;
  const MODS=deptMods(),N=MODS.length,R=40,pos=i=>{const a=(-90+i*360/N)*Math.PI/180;return[50+R*Math.cos(a),50+R*Math.sin(a)]};
  const col=i=>WHEEL_COLORS[i%WHEEL_COLORS.length];
  const arcs=MODS.map((m,i)=>{const[x1,y1]=pos(i),[x2,y2]=pos((i+1)%N);return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${col(i+1)}" stroke-width="1.6"/>`}).join("");
  const nodes=MODS.map((m,i)=>{
    const[x,y]=pos(i),locked=db&&((m.k==="quote"&&!canQuote())||(m.k==="inv"&&!invCan("view"))),ready=!!m.go&&!locked,stat=locked?"需要權限":ready?moduleStat(m):"建置中",n=m.k==="remind"&&db?remindList().length:0;
    return `<button class="node${ready?"":" soon"}" type="button" data-mod="${m.k}" style="--c:${col(i)};left:${x}%;top:${y}%" title="${esc(m.nm+"："+m.ds+(stat?"（"+stat+"）":""))}" aria-label="${esc(m.nm+(ready?"":"（建置中）"))}">

function openModule(k){
  const m=MODULES.find(x=>x.k===k);if(!m)return;
  if(!m.go){toast("「"+m.nm+"」功能建置中，敬請期待");return}
  soloTab=m.solo?m.go:"";

}

  async fd=>{const read=()=>secs.map((_,i)=>[val(fd,"st_"+i),String(fd.get("sb_"+i)||"").trim()]).filter(([t,b])=>t||b);
    await setDoc(doc(fs,"hrSettings","job_"+k),{title:val(fd,"title"),dept:val(fd,"dept"),role:val(fd,"role"),boss:val(fd,"boss"),place:val(fd,"place"),sections:read().map(([t,b])=>({t,b})),updatedAt:new Date().toISOString(),updatedBy:me.email});toast("已儲存工作說明書")},true);
  const box=$("#secBox"),sync=()=>{secs=secs.map((x,i)=>[form.elements["st_"+i]?.value??x[0],form.elements["sb_"+i]?.value??x[1]])},redraw=()=>{box.innerHTML=secHtml();addVoice(Object.fromEntries(secs.map((_,i)=>["sb_"+i,"append"])))};

  redraw();

/* ---------- data (Firebase) ---------- */
/* 去除 undefined 欄位，Firestore 不接受 undefined */
const clean=d=>JSON.parse(JSON.stringify(d));
// 更新時保留 deleteField() 等特殊值，其餘照常去除 undefined
const cleanUpd=d=>Object.fromEntries(Object.entries(d).filter(([,v])=>v!==undefined).map(([k,v])=>[k,v&&typeof v==="object"&&!Array.isArray(v)&&v.constructor!==Object?v:clean(v)]));
const wrap=r=>({id:r.id,set:d=>setDoc(r,clean(d)),update:d=>updateDoc(r,cleanUpd(d)),delete:()=>deleteDoc(r)});
const fsdb={
  collection:n=>({
    onSnapshot:(next,err)=>onSnapshot(collection(fs,n),{includeMetadataChanges:true},snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:snap.metadata}),err),
    doc:id=>wrap(id?doc(fs,n,id):doc(collection(fs,n)))
  }),
  doc:p=>wrap(doc(fs,p))
};
let dbMsg="正在連線資料庫…", unsubs=[];
function startData(){
  db=fsdb; canWrite=me.role!=="viewer"; startData.reminded=false;
  const timer=setTimeout(()=>{$("#sync").textContent="暫時無法取得最新資料，請檢查網路"},10000);
  const fresh={};
  for(const name of ["equipment","customers","contracts","quotes","calls"]){
    unsubs.push(db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[name]=true;
      if(!snap.metadata.fromCache)fresh[name]=true;
      if(Object.keys(fresh).length===5){clearTimeout(timer);$("#sync").textContent="已同步 · 多人即時共用";if(!startData.reminded){startData.reminded=true;setTimeout(autoRemind,300)}}
      if(!dlg.open)render();
    },err=>{S.loaded[name]=true;fresh[name]=true;console.warn("讀取失敗",name,err.code);if(Object.keys(fresh).length===5)clearTimeout(timer);$("#sync").textContent=err.code==="permission-denied"?"部分資料沒有存取權限（"+name+"）":"資料連線中斷，請重新整理頁面";render()}));
  }
  if(canWrite)unsubs.push(onSnapshot(query(collection(fs,"signReqs"),where("status","==","signed")),snap=>snap.docs.forEach(applyRemote),err=>console.warn("signReqs",err.code)));
  {const hrSub=(col,set,admin)=>{if(admin&&me.role!=="admin")return;unsubs.push(onSnapshot(collection(fs,col),snap=>{set(snap.docs);if(!dlg.open)render()},err=>{S.hrErr=err.code;if(!dlg.open)render()}))};
   hrSub("invProducts",d=>{S.invProd=d.filter(x=>!x.id.startsWith("_opt_")).map(x=>({id:x.id,...x.data()}));S.dimLists={};d.filter(x=>x.id.startsWith("_opt_")).forEach(x=>{const k=x.id==="_opt_fanDims"?"1":x.id.replace("_opt_dims_","");S.dimLists[k]=x.data().list||[]})});
   hrSub("invDocs",d=>S.invDocs=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrEmployees",d=>S.hrEmp=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrPositions",d=>S.hrPos=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrCharter",d=>S.chArt=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrCharterNotes",d=>S.chNotes=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrCharterAcks",d=>S.chAcks=d.map(x=>({id:x.id,...x.data()})));
   hrSub("hrSettings",d=>{const v=d.find(x=>x.id==="vision");S.vision=v?v.data():null;const c=d.find(x=>x.id==="charter");S.charter=c?c.data():null;{const t=d.find(x=>x.id==="salesTargets");S.targets=t?t.data():{}}{const t=d.find(x=>x.id==="invPricing");S.priceDiv=+(t?.data().div)||0.6}S.jobs={};d.filter(x=>x.id.startsWith("job_")).forEach(x=>S.jobs[x.id.slice(4)]=x.data());const ir=d.find(x=>x.id==="invCodeRule10");S.invRule=ir?ir.data().text:""});
   hrSub("hrContracts",d=>S.hrCon=d.map(x=>({id:x.id,...x.data()})),true);
   hrSub("hrPrivate",d=>{S.hrPriv={};d.forEach(x=>S.hrPriv[x.id]=x.data())},true);}
  unsubs.push(onSnapshot(collection(fs,"staff"),snap=>{S.staff=snap.docs.map(d=>({id:d.id,...d.data()}));if(!dlg.open)render()},()=>{}));
  render();
}
function stopData(){unsubs.forEach(u=>u());unsubs=[];db=null;S.equipment=[];S.customers=[];S.contracts=[];S.quotes=[];S.calls=[];S.staff=[];S.invProd=[];S.invDocs=[];S.hrEmp=[];S.hrPos=[];S.chArt=[];S.chNotes=[];S.chAcks=[];S.charter=null;S.hrCon=[];S.hrPriv={};S.vision=null;S.hrErr="";me=null;for(const k in S.loaded)S.loaded[k]=false}
const loginErr=t=>{const e=$("#loginErr");e.textContent=t;e.hidden=!t};
const authMsg=c=>({"auth/invalid-credential":"Email 或密碼錯誤。","auth/invalid-email":"Email 格式不正確。","auth/too-many-requests":"嘗試次數太多，請稍後再試。","auth/network-request-failed":"網路連線失敗，請檢查網路。","auth/missing-password":"請輸入密碼。"})[c]||"登入失敗，請再試一次。";

  stopData();
  if(!u){$("#appView").hidden=true;$("#menuView").hidden=true;$("#deptView").hidden=true;$("#loginView").hidden=false;return}
  const email=String(u.email).toLowerCase();
  let info=null;
  try{const snap=await getDoc(doc(fs,"staff",email));if(snap.exists())info=snap.data()}catch(err){}
  if(email===OWNER)info={...(info||{}),role:"admin",active:true};
  if(!info||info.active===false){await signOut(auth);loginErr(info?"此帳號已停用，請聯絡管理員。":"此帳號尚未開通，請聯絡管理員。");return}

  $("#whoami").textContent=$("#whoami2").textContent=$("#whoami3").textContent=(me.name||email)+" · "+ROLES[me.role];$("#loginView").hidden=true;$("#appView").hidden=true;$("#menuView").hidden=true;showDept();startData();
});
