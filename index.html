<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa0">
<title>大森租賃管理系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + tab bar, one-column work list; stat strip on overview; dialog forms */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#dde2ea; --fg:#1b2230; --muted:#5d6779;
  --accent:#1f4fa0; --accent-soft:#e6edf8; --on-accent:#ffffff;
  --ok:#1d7a4c; --ok-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b4282c; --bad-soft:#fae4e4;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --line:#2c3441; --fg:#e6eaf0; --muted:#9aa4b4;
  --accent:#7aa2e8; --accent-soft:#22314a; --on-accent:#0e1626;
  --ok:#5fca94; --ok-soft:#173326; --warn:#e6a44a; --warn-soft:#3a2a12; --bad:#f07a7d; --bad-soft:#3d1c1e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12.5px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:18px 48px;display:grid;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{flex:1 1 180px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:500;padding:9px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
section h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--bg);color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.dlg{display:grid;gap:14px;padding:18px}
.dlg h3{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .spacer{flex:1}
.calc{background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%);display:grid;gap:14px;box-sizing:border-box}
.login h1{font-size:21px}
.userbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.userbox .sub{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="login" id="loginView">
  <form id="loginForm" novalidate>
    <div><h1>大森租賃管理</h1><div class="sub">請使用公司開通的帳號登入</div></div>
    <div class="banner" id="loginErr" hidden></div>
    <label>Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label>密碼<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="loginBtn">登入</button>
    <button class="btn" type="button" id="resetBtn">忘記密碼</button>
  </form>
</div>
<div id="appView" hidden>
<header>
  <div class="wrap">
    <div class="head">
      <div><h1>租賃管理</h1><div class="sub" id="sync">連線中…</div></div>
      <div class="userbox"><span class="sub" id="whoami"></span><button class="btn small" id="remindBtn" type="button" hidden>到期提醒 <b class="mono" id="remindCount">0</b></button><button class="btn small" id="logoutBtn" type="button">登出</button><button class="btn primary" id="newBtn" type="button">＋ 新增租約</button></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">總覽</button>
      <button role="tab" data-tab="contracts" aria-selected="false">租約</button>
      <button role="tab" data-tab="equipment" aria-selected="false">設備</button>
      <button role="tab" data-tab="customers" aria-selected="false">客戶</button>
      <button role="tab" data-tab="accounts" aria-selected="false" id="accTab" hidden>帳號</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<dialog id="dlg"><form class="dlg" id="dlgForm" novalidate></form></dialog>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,getDoc} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyA-lXRTR38AeFMgSwYCD91Akywgxgb5ZB4",authDomain:"daisen-rental.firebaseapp.com",projectId:"daisen-rental",storageBucket:"daisen-rental.firebasestorage.app",messagingSenderId:"687274188760",appId:"1:687274188760:web:41035f0278d21ebd99dcad"};
const fbApp=initializeApp(firebaseConfig),fs=getFirestore(fbApp),auth=getAuth(fbApp);
/* 系統擁有者：永遠是管理員，用來開通第一批帳號 */
const OWNER="daisen0800558929@gmail.com";
const ROLES={admin:"管理員",staff:"員工",viewer:"檢視"};
let me=null;
const S={equipment:[],customers:[],contracts:[],staff:[],loaded:{equipment:false,customers:false,contracts:false}};
let db=null, canWrite=true, tab="overview", q="", filter="all";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"NT$ "+Math.round(n||0).toLocaleString("zh-TW");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayNum=s=>{const [y,m,d]=String(s).split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* 計費：日租 = 天數 × 單價；月租 = 以 30 天為一期，不足一期以一期計 */
function rentDays(c){const end=c.status==="已歸還"&&c.returnDate?c.returnDate:c.end;return Math.max(1,daysBetween(c.start,end)+1)}
function rentAmount(c){const d=rentDays(c);return c.unit==="月"?Math.ceil(d/30)*(+c.rate||0):d*(+c.rate||0)}
/* 到期提醒天數：每筆租約可自訂，預設 7 天 */
const remindOf=c=>{const n=parseInt(c.remindDays,10);return Number.isFinite(n)&&n>=0?n:7};
/* Google 行事曆：產生「新增活動」連結（全天活動） */
function addDays(d,n){const t=new Date(dayNum(d)*864e5+n*864e5);return t.toISOString().slice(0,10)}
function gcalUrl(title,date,details,location){
  const ymd=d=>d.replace(/-/g,"");
  const p=new URLSearchParams({action:"TEMPLATE",text:title,dates:ymd(date)+"/"+ymd(addDays(date,1)),details,location:location||"",ctz:"Asia/Taipei"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function gcalLinks(c){
  const cu=cust(c.customerId),eq=equip(c.equipmentId),who=(cu?.name||"客戶")+"－"+(eq?.name||"設備");
  const info=[`租約單號：${c.no||""}`,`客戶：${cu?.name||""}${cu?.phone?"（"+cu.phone+"）":""}`,`設備：${eq?`${eq.code} ${eq.name}`:""}`,`租期：${c.start} → ${c.end}`,
    c.site?`使用地點：${c.site}${c.sitePhone?"（"+c.sitePhone+"）":""}`:"",`系統：${location.origin+location.pathname}`].filter(Boolean).join("\n");
  const rd=remindOf(c),items=[{k:"起租日",d:c.start,t:`【起租】${who}`}];
  if(rd>0&&addDays(c.end,-rd)>c.start)items.push({k:"提醒日",d:addDays(c.end,-rd),t:`【到期提醒】${who}（${c.end} 到期）`});
  items.push({k:"到期日",d:c.end,t:`【租約到期】${who}`});
  return items.map(i=>`<a class="btn small" href="${esc(gcalUrl(i.t,i.d,info,c.site))}" target="_blank" rel="noopener">${i.k} <span class="mono">${esc(i.d.slice(5))}</span></a>`).join("");
}
function cState(c){
  if(c.status==="已歸還")return{label:"已歸還",cls:"mute",k:"done"};
  if(c.status==="已取消")return{label:"已取消",cls:"mute",k:"done"};
  const t=todayStr();
  if(c.start>t)return{label:"未開始",cls:"",k:"future"};
  const left=daysBetween(t,c.end);
  if(left<0)return{label:"逾期 "+(-left)+" 天",cls:"bad",k:"overdue"};
  if(left<=remindOf(c))return{label:left===0?"今日到期":left+" 天後到期",cls:"warn",k:"soon"};
  return{label:"租賃中",cls:"ok",k:"active"};
}
const cust=id=>S.customers.find(x=>x.id===id);
const equip=id=>S.equipment.find(x=>x.id===id);
function activeContractOf(eid){return S.contracts.find(c=>c.equipmentId===eid&&c.status==="租賃中")}
function eState(e){
  if(e.repair)return{label:"維修中",cls:"warn"};
  const c=activeContractOf(e.id);
  if(c)return{label:"出租中",cls:"",c};
  return{label:"可出租",cls:"ok"};
}

/* ---------- render ---------- */
function render(){
  updateRemind();
  $("#accTab").hidden=me?.role!=="admin";if(tab==="accounts"&&me?.role!=="admin")tab="overview";
  $("#newBtn").hidden=!canWrite;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const m=$("#main");
  if(!db){m.innerHTML=`<div class="banner" id="nodb">${esc(dbMsg)}</div>`;return}
  const loading=!Object.values(S.loaded).every(Boolean);
  let h="";
  if(tab==="overview")h=viewOverview(loading);
  if(tab==="contracts")h=viewContracts(loading);
  if(tab==="equipment")h=viewEquipment(loading);
  if(tab==="customers")h=viewCustomers(loading);
  if(tab==="accounts")h=me?.role==="admin"?viewAccounts():"";
  m.innerHTML=h;
  const si=$("#q");if(si){si.value=q;si.oninput=e=>{q=e.target.value;renderKeepFocus()}}
  const sf=$("#f");if(sf){sf.value=filter;sf.onchange=e=>{filter=e.target.value;render()}}
}
function renderKeepFocus(){const pos=$("#q")?.selectionStart;render();const el=$("#q");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
function contractRow(c){
  const st=cState(c),cu=cust(c.customerId),eq=equip(c.equipmentId);
  return `<div class="row" data-open="contract" data-id="${esc(c.id)}" tabindex="0">
    <div><div class="t">${esc(cu?.name||"（客戶已刪除）")}　<span class="m">${esc(eq?.name||"（設備已刪除）")}</span></div>
    <div class="m"><span class="mono">${esc(c.no||"")}</span> · ${esc(c.start)} → ${esc(c.end)}</div></div>
    <div class="r"><span class="pill ${st.cls}">${esc(st.label)}</span><span class="mono m">${money(rentAmount(c))}</span></div></div>`;
}
function emptyOr(rows,loading,msg){if(loading&&!rows.length)return`<div class="empty">資料載入中…</div>`;return rows.length?rows.join(""):`<div class="empty">${msg}</div>`}
function viewOverview(loading){
  const live=S.contracts.filter(c=>c.status==="租賃中");
  const overdue=live.filter(c=>cState(c).k==="overdue").sort((a,b)=>a.end.localeCompare(b.end));
  const soon=live.filter(c=>cState(c).k==="soon").sort((a,b)=>a.end.localeCompare(b.end));
  const avail=S.equipment.filter(e=>eState(e).label==="可出租").length;
  const monthly=live.reduce((s,c)=>s+(c.unit==="月"?+c.rate||0:(+c.rate||0)*30),0);
  return `<div class="stats">
    <div class="stat"><span class="k">出租中</span><span class="v">${live.length}</span></div>
    <div class="stat bad"><span class="k">逾期未還</span><span class="v">${overdue.length}</span></div>
    <div class="stat warn"><span class="k">即將到期</span><span class="v">${soon.length}</span></div>
    <div class="stat"><span class="k">可出租設備</span><span class="v">${avail}<span class="note"> / ${S.equipment.length}</span></span></div></div>
  <div class="note">出租中租約每月租金合計約 <span class="mono">${money(monthly)}</span>（日租以 30 天估算）</div>
  <section><h2>逾期未還 <small>請聯絡客戶歸還或續約</small></h2><div class="list">${emptyOr(overdue.map(contractRow),loading,"目前沒有逾期的租約")}</div></section>
  <section><h2>即將到期 <small>到期前 7 天開始提醒（可在租約中調整）</small></h2><div class="list">${emptyOr(soon.map(contractRow),loading,"近期沒有即將到期的租約")}</div></section>`;
}
function viewContracts(loading){
  const qq=q.trim().toLowerCase();
  let rows=S.contracts.filter(c=>{
    const st=cState(c).k;
    if(filter==="live"&&c.status!=="租賃中")return false;
    if(filter==="overdue"&&st!=="overdue")return false;
    if(filter==="done"&&st!=="done")return false;
    if(!qq)return true;
    return [c.no,cust(c.customerId)?.name,equip(c.equipmentId)?.name,equip(c.equipmentId)?.code].join(" ").toLowerCase().includes(qq);
  }).sort((a,b)=>b.start.localeCompare(a.start));
  return `<div class="toolbar"><input id="q" placeholder="搜尋單號、客戶、設備"><select id="f" style="flex:0 1 150px">
    <option value="all">全部租約</option><option value="live">租賃中</option><option value="overdue">逾期</option><option value="done">已結案</option></select></div>
  <div class="list">${emptyOr(rows.map(contractRow),loading,S.contracts.length?"沒有符合條件的租約":"還沒有租約。按右上角「新增租約」建立第一筆。")}</div>`;
}
function viewEquipment(loading){
  const qq=q.trim().toLowerCase();
  const rows=S.equipment.filter(e=>!qq||[e.code,e.name,e.category,e.serial].join(" ").toLowerCase().includes(qq))
    .sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(e=>{
    const st=eState(e);const cu=st.c?cust(st.c.customerId):null;
    return `<div class="row" data-open="equipment" data-id="${esc(e.id)}" tabindex="0">
      <div><div class="t">${esc(e.name)}</div><div class="m"><span class="mono">${esc(e.code)}</span>${e.category?" · "+esc(e.category):""}${e.serial?" · 序號 "+esc(e.serial):""}${cu?" · 租給 "+esc(cu.name):""}</div></div>
      <div class="r"><span class="pill ${st.cls}">${st.label}</span><span class="mono m">${e.rate?money(e.rate)+" / "+esc(e.unit||"月"):""}</span></div></div>`});
  return `<div class="toolbar"><input id="q" placeholder="搜尋編號、名稱、序號">${canWrite?'<button class="btn" type="button" data-new="equipment">＋ 新增設備</button>':""}</div>
  <div class="list">${emptyOr(rows,loading,"還沒有設備資料。先新增設備，才能建立租約。")}</div>`;
}
function viewCustomers(loading){
  const qq=q.trim().toLowerCase();
  const rows=S.customers.filter(c=>!qq||[c.name,c.contact,c.phone,c.taxId].join(" ").toLowerCase().includes(qq))
    .sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh-Hant")).map(c=>{
    const n=S.contracts.filter(k=>k.customerId===c.id&&k.status==="租賃中").length;
    return `<div class="row" data-open="customer" data-id="${esc(c.id)}" tabindex="0">
      <div><div class="t">${esc(c.name)}</div><div class="m">${esc(c.contact||"")}${c.phone?" · "+esc(c.phone):""}${c.taxId?" · 統編 "+esc(c.taxId):""}</div></div>

/* 每位使用者每天第一次開啟系統時自動跳出一次 */
function autoRemind(){
  if(!me||!remindList().length||dlg.open)return;

  try{if(localStorage.getItem(key))return;localStorage.setItem(key,"1")}catch(e){}

  ${isNew?'<div class="note">建立後請把 Email 和初始密碼告訴同事，並請他登入後用「忘記密碼」自行改成新密碼。</div>':""}
  ${locked?'<div class="note">'+(owner?"系統擁有者固定為管理員。":"不能變更自己的權限或停用自己。")+'</div>':""}
  <div class="actions">${!isNew?'<button class="btn" type="button" id="resetPw">寄重設密碼信</button>'+(!locked?'<button class="btn danger" type="button" id="del">移除</button>':"")+'<span class="spacer"></span>':""}<button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">${isNew?"建立帳號":"儲存"}</button></div>`,
  async fd=>{
    const d={name:val(fd,"name"),role:locked?(owner?"admin":u.role||"staff"):val(fd,"role"),active:locked?true:fd.get("active")==="1",updatedAt:new Date().toISOString(),updatedBy:me.email};
    if(!d.name){showErr({message:"請填寫姓名。"});return false}
    if(isNew){
      const email=val(fd,"email").toLowerCase(),pw=String(fd.get("pw")||"");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){showErr({message:"Email 格式不正確。"});return false}
      if(pw.length<6){showErr({message:"初始密碼至少需要 6 個字。"});return false}
      if(S.staff.some(x=>x.id===email)){showErr({message:"這個 Email 已經有帳號了。"});return false}
      let existed=false;
      try{
        if(!authSecondary)authSecondary=getAuth(initializeApp(firebaseConfig,"secondary"));
        await createUserWithEmailAndPassword(authSecondary,email,pw);await signOut(authSecondary);
      }catch(err){
        if(err.code==="auth/email-already-in-use")existed=true;
        else{showErr({message:({"auth/weak-password":"密碼太簡單，請至少 6 個字。","auth/invalid-email":"Email 格式不正確。"})[err.code]||"建立帳號失敗："+(err.code||err.message)});return false}
      }
      await setDoc(doc(fs,"staff",email),{...d,createdAt:new Date().toISOString(),createdBy:me.email});
      toast(existed?"此 Email 已有登入帳號，已開通權限（密碼沿用原本的）":"已建立帳號 "+email);
    }else{await setDoc(doc(fs,"staff",u.id),d,{merge:true});toast("已儲存")}
  });
  const rp=form.querySelector("#resetPw");if(rp)rp.onclick=async()=>{try{await sendPasswordResetEmail(auth,u.id);toast("已寄出重設密碼信到 "+u.id)}catch(e){showErr({message:"寄送失敗，請稍後再試。"})}};
  if(!isNew&&!locked)confirmDelete("#del","帳號",()=>deleteDoc(doc(fs,"staff",u.id)));
}
$("#main").addEventListener("click",e=>{if(e.target.closest("[data-newacc]")){accountForm(null);return}
  const r=e.target.closest("[data-acc]");if(r){const u=S.staff.find(x=>x.id===r.dataset.acc);if(u)accountForm(u)}});
$("#main").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest("[data-acc]");if(r){const u=S.staff.find(x=>x.id===r.dataset.acc);if(u)accountForm(u)}}});

/* ---------- data (Firebase) ---------- */
const wrap=r=>({set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)});
const fsdb={
  collection:n=>({
    onSnapshot:(next,err)=>onSnapshot(collection(fs,n),{includeMetadataChanges:true},snap=>next({docs:snap.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:snap.metadata}),err),
    doc:id=>wrap(id?doc(fs,n,id):doc(collection(fs,n)))
  }),
  doc:p=>wrap(doc(fs,p))
};
let dbMsg="正在連線資料庫…", unsubs=[];
function startData(){
  db=fsdb; canWrite=me.role!=="viewer"; startData.reminded=false;
  const timer=setTimeout(()=>{$("#sync").textContent="暫時無法取得最新資料，請檢查網路"},10000);
  const fresh={};
  for(const name of ["equipment","customers","contracts"]){
    unsubs.push(db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[name]=true;
      if(!snap.metadata.fromCache)fresh[name]=true;
      if(Object.keys(fresh).length===3){clearTimeout(timer);$("#sync").textContent="已同步 · 多人即時共用";if(!startData.reminded){startData.reminded=true;setTimeout(autoRemind,300)}}
      if(!dlg.open)render();
    },err=>{clearTimeout(timer);S.loaded[name]=true;$("#sync").textContent=err.code==="permission-denied"?"此帳號沒有存取權限":"資料連線中斷，請重新整理頁面";render()}));
  }
  if(me.role==="admin")unsubs.push(onSnapshot(collection(fs,"staff"),snap=>{S.staff=snap.docs.map(d=>({id:d.id,...d.data()}));if(!dlg.open)render()},()=>{}));
  render();
}
function stopData(){unsubs.forEach(u=>u());unsubs=[];db=null;S.equipment=[];S.customers=[];S.contracts=[];S.staff=[];me=null;for(const k in S.loaded)S.loaded[k]=false}
const loginErr=t=>{const e=$("#loginErr");e.textContent=t;e.hidden=!t};
const authMsg=c=>({"auth/invalid-credential":"Email 或密碼錯誤。","auth/invalid-email":"Email 格式不正確。","auth/too-many-requests":"嘗試次數太多，請稍後再試。","auth/network-request-failed":"網路連線失敗，請檢查網路。","auth/missing-password":"請輸入密碼。"})[c]||"登入失敗，請再試一次。";
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();loginErr("");const b=$("#loginBtn");b.disabled=true;
  try{await signInWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPw").value)}catch(err){loginErr(authMsg(err.code))}finally{b.disabled=false}});
$("#resetBtn").onclick=async()=>{const em=$("#loginEmail").value.trim();if(!em){loginErr("請先輸入 Email，再按忘記密碼。");return}
  try{await sendPasswordResetEmail(auth,em);loginErr("");toast("已寄出重設密碼信，請到信箱收信")}catch(err){loginErr(authMsg(err.code))}};
$("#logoutBtn").onclick=()=>signOut(auth);
dlg.addEventListener("close",()=>render());
onAuthStateChanged(auth,async u=>{
  stopData();
  if(!u){$("#appView").hidden=true;$("#loginView").hidden=false;return}
  const email=String(u.email).toLowerCase();
  let info=null;
  try{const snap=await getDoc(doc(fs,"staff",email));if(snap.exists())info=snap.data()}catch(err){}
  if(email===OWNER)info={...(info||{}),role:"admin",active:true};
  if(!info||info.active===false){await signOut(auth);loginErr(info?"此帳號已停用，請聯絡管理員。":"此帳號尚未開通，請聯絡管理員。");return}
  me={email,name:info.name||"",role:ROLES[info.role]?info.role:"staff"};
  $("#whoami").textContent=(me.name||email)+" · "+ROLES[me.role];$("#loginView").hidden=true;$("#appView").hidden=false;startData();
});
</script>
</body>
</html>
